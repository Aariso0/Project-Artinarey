name: CI

on:
  push:
    branches: [main, "M*", "MO/**"]
  pull_request:
    branches: [main, "M*", "MO/**"]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm run test:ci
      - run: pnpm build
      - run: pnpm run audit
      - run: pnpm run version:check
      - name: Check whitespace in submitted commits
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            base="$BASE_SHA"
          elif [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            # First push to a new branch has no before/base_ref; use the default branch.
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "::error::Cannot determine comparison base: repository default branch is empty" >&2
              exit 1
            fi
            base="origin/$DEFAULT_BRANCH"
            if ! git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" >/dev/null; then
              if ! git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"; then
                echo "::error::Failed to fetch default branch '$DEFAULT_BRANCH' for comparison" >&2
                exit 1
              fi
            fi
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "::error::Comparison base '$base' does not resolve to a local commit" >&2
            exit 1
          fi
          git diff --check "$base"...HEAD
      - run: pnpm build:gui

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUST_VERSION: stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle the daemon sidecar
        run: node .github/scripts/build-daemon-sidecar.cjs
      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/gui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      - run: cargo test --manifest-path apps/gui/src-tauri/Cargo.toml
      - run: cargo build --manifest-path apps/gui/src-tauri/Cargo.toml
