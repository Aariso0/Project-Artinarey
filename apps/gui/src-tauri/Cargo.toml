[package]
name = "artinarey-gui"
version = "0.1.0"
edition = "2021"
description = "Artinarey read-only desktop window"
license = "GPL-3.0-only"
autotests = false

[[test]]
name = "proxy_test"
path = "tests/proxy.test.rs"

[lib]
name = "artinarey_gui_lib"
path = "src/lib.rs"

[[bin]]
name = "artinarey-gui"
path = "src/main.rs"

[dependencies]
tauri = { version = "=2.9.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }
